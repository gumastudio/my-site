const catLabel={'WEB•APP':'WEB · APP','BRANDING':'BRANDING','DIGITAL CONTENTS':'DIGITAL','MOTION GRAPHIC':'MOTION','EDITORIAL DESIGN':'EDITORIAL'};
const grid = document.getElementById('grid');
function render(cat){
  grid.innerHTML='';
  const visible = projects.filter(p => cat === 'ALL' || p.cat === cat);
  if (!visible.length){grid.textContent = '아직 등록된 작업물이 없습니다.';return;}
  visible.forEach((p,i)=>{
    const c=document.createElement('button');
    c.className='work-card reveal';
    c.style.transitionDelay=(i*45)+'ms';
    c.innerHTML=`
      <img src="img/${p.id}.${p.ext||'jpg'}" alt="${p.title}" loading="lazy">
      <span class="work-cat">${catLabel[p.cat]||p.cat}</span>
      <span class="work-title">${p.title}</span>
      <span class="work-year">${p.year}</span>`;
    c.onclick=()=>openModal(p);
    grid.appendChild(c);
    requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.add('in')));
  });
}
render('ALL');

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelector('.tab[aria-pressed="true"]').setAttribute('aria-pressed','false');
    t.setAttribute('aria-pressed','true');
    render(t.dataset.cat);
  };
});

// modal
const modal=document.getElementById('modal');
function openModal(p){
  mImg.src='img/'+p.id+'.'+(p.ext||'jpg'); mImg.alt=p.title;
  mCat.textContent=catLabel[p.cat]||p.cat;
  mTitle.textContent=p.title;
  mDesc.textContent=p.desc;
  mRole.textContent=p.role;
  mTools.textContent=p.tools;
  mPeriod.textContent=p.period||'—';
  mContrib.textContent=p.contrib;
  const link=document.getElementById('mLink');
  if(p.link){link.style.display='inline-flex';link.href=p.link;}
  else{link.style.display='none';}
  modal.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){modal.classList.remove('open');document.body.style.overflow='';}
document.getElementById('mClose').onclick=closeModal;
modal.onclick=e=>{if(e.target===modal)closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// nav border on scroll
const nav=document.getElementById('nav');
addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>10),{passive:true});
</script>
