<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEO BO GEUM — Work</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="portfolio.css">
</head>
<body>

<nav id="nav">
  <a href="index.html" class="brand">서보금 <b>·</b> Portfolio</a>
  <div class="links">
    <a href="index.html#work" aria-current="page">Work</a>
    <a href="index.html#now">Now</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
  </div>
</nav>

<!-- WORK -->
<section id="work" style="border-top:0;padding-top:clamp(130px,20vh,200px)">
  <div class="wrap">
    <div class="sec-head">
      <h1 class="sec-label">selected work<span class="dot">.</span></h1>
      <a href="index.html" class="pill">← 홈으로</a>
    </div>
    <p class="sec-intro">카테고리를 눌러 작업을 골라보세요. 카드를 클릭하면 상세 페이지가 열립니다.</p>

    <div class="tabs" id="tabs" role="group" aria-label="프로젝트 분류">
      <button class="tab" aria-pressed="true" data-cat="ALL">All</button>
      <button class="tab" aria-pressed="false" data-cat="WEB•APP">Web·App</button>
      <button class="tab" aria-pressed="false" data-cat="BRANDING">Branding</button>
      <button class="tab" aria-pressed="false" data-cat="EDITORIAL DESIGN">Editorial</button>
      <button class="tab" aria-pressed="false" data-cat="PROPOSAL">Proposal</button>
    </div>

    <div class="work-grid" id="grid"></div>
  </div>
</section>

<script src="projects-data.js"></script>
<script>
const grid = document.getElementById('grid');
function render(cat){
  grid.innerHTML='';
  const visible = projects.filter(p => cat === 'ALL' || p.cat === cat);
  if (!visible.length){grid.textContent = '아직 등록된 작업물이 없습니다.';return;}
  visible.forEach((p,i)=>{
    const c=document.createElement('a');
    c.className='work-card reveal';
    let href = p.page || ('work.html?id='+encodeURIComponent(p.id));
    if(cat && cat!=='ALL') href += (href.includes('?')?'&':'?')+'cat='+encodeURIComponent(cat);
    c.href = href;
    c.style.transitionDelay=(i*45)+'ms';
    c.innerHTML=`
      <img src="img/${p.id}.${p.ext||'jpg'}" alt="${p.title}" loading="lazy">
      <span class="work-cat">${catLabel[p.cat]||p.cat}</span>
      <span class="work-title">${p.title}</span>
      <span class="work-year">${p.year}</span>`;
    grid.appendChild(c);
    requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.add('in')));
  });
}
const initCat = new URLSearchParams(location.search).get('cat') || 'ALL';
const initTab = [...document.querySelectorAll('.tab')].find(t=>t.dataset.cat===initCat) || document.querySelector('.tab[data-cat="ALL"]');
document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed', t===initTab ? 'true' : 'false'));
render(initTab.dataset.cat);

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelector('.tab[aria-pressed="true"]').setAttribute('aria-pressed','false');
    t.setAttribute('aria-pressed','true');
    render(t.dataset.cat);
  };
});

const nav=document.getElementById('nav');
addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>10),{passive:true});
</script>
</body>
</html>
